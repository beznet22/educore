[package]
name = "educore-wasm-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM-compatible demo of the Educore engine's pure logic (tenancy, ids, validation, value objects). Compiles to wasm32-unknown-unknown for browser execution."

[lints]
workspace = true

[lib]
